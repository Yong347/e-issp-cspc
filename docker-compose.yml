version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: issp_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-issp_core}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: issp_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. FastAPI Backend Server
  web:
    build: .
    container_name: issp_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/code
      - uploads_data:/code/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-issp_core}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # 4. Celery Background Worker (Dual-Pass PDF & Word Compilation)
  worker:
    build: .
    container_name: issp_worker
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - .:/code
      - uploads_data:/code/uploads
    env_file:
      - .env
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-issp_core}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # 5. Celery Beat Scheduler (Automated Annual Rollover & Expiration Checks)
  beat:
    build: .
    container_name: issp_beat
    restart: always
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-issp_core}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  # 6. Production Nginx & React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: issp_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  uploads_data:
