version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: issp_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=issp_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: issp_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. FastAPI Web Server
  web:
    build: .
    container_name: issp_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/code
      - uploads_data:/code/uploads
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/issp_core
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - SECRET_KEY=secure_fallback_local_secret_key_12345
      - DB_ENCRYPTION_KEY=cspc_secure_symmetric_encryption_key_value,cspc_secondary_rotation_key_value
      - DB_ENCRYPTION_SALT=cspc_issp_secure_static_encryption_salt
      - DEFAULT_SEED_PASSWORD=secure_seed_password_999
    depends_on:
      - db
      - redis

  # 4. Celery Background Worker (Required for PDF Generation)
  worker:
    build: .
    container_name: issp_worker
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/code
      - uploads_data:/code/uploads
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/issp_core
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - SECRET_KEY=secure_fallback_local_secret_key_12345
      - DB_ENCRYPTION_KEY=cspc_secure_symmetric_encryption_key_value,cspc_secondary_rotation_key_value
      - DB_ENCRYPTION_SALT=cspc_issp_secure_static_encryption_salt
    depends_on:
      - redis

# Declarations for persistent storage
volumes:
  postgres_data:
  uploads_data: